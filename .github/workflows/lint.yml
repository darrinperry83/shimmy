name: lint

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: .
          format: tty
          severity: warning
        continue-on-error: true
  clang-format:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: clang-format check (non-blocking)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq clang-format
          files=$(find src third_party -name '*.c' -o -name '*.h' -o -name '*.m' -o -name '*.mm' 2>/dev/null | head -400)
          if [ -n "$files" ]; then clang-format --dry-run -Werror $files 2>&1 | head -40 || true; fi
