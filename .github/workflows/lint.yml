name: lint

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: .
          format: tty
          severity: warning
  clang-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: clang-format check
        uses: jidicula/clang-format-action@v4
        with:
          clang-format-version: '18'
          check-path: 'src'
          fallback-style: 'LLVM'
