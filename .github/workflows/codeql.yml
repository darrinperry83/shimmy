name: codeql

on:
  push:
    branches: [main, develop]
  pull_request:
  schedule:
    - cron: '30 2 * * 1'

permissions:
  security-events: write

jobs:
  analyze:
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        language: [c-cpp]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3
