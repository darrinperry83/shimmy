name: stale

on:
  schedule:
    - cron: '0 3 * * *'

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          days-before-stale: 60
          days-before-close: 14
          stale-issue-message: 'This issue is stale. It will be closed in 14 days unless it is updated.'
          stale-pr-message: 'This PR is stale. It will be closed in 14 days unless it is updated.'
